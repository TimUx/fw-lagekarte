name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version for a build-only rehearsal (empty = package.json)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set embedded package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          BUILD_VERSION: ${{ inputs.version }}
        run: npm run release:prepare

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux -- --publish never

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --publish never

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac -- --publish never

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg
          if-no-files-found: error

  verify-artifacts:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve expected version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          BUILD_VERSION: ${{ inputs.version }}
        run: npm run release:prepare

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: artifacts
          pattern: '*-build'

      - name: Install package inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y 7zip libimage-exiftool-perl

      - name: Verify every installer payload and package version
        run: npm run release:verify -- artifacts

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download verified artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: artifacts
          pattern: '*-build'

      - name: Publish new GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify-artifacts.outputs.version }}
        run: |
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "Error: tag and verified package version differ"
            exit 1
          fi

          flags=()
          [[ "$RELEASE_VERSION" != *-* ]] || flags+=(--prerelease)
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            "${flags[@]}" \
            --title "Release $RELEASE_TAG" \
            --notes "Automatischer Build für $RELEASE_TAG; Paketversionen aller vier Installer geprüft." \
            artifacts/*/*

          gh release download "$RELEASE_TAG" --dir published
          files=(published/*)
          if [[ "${#files[@]}" -ne 4 ]]; then
            echo "Error: expected all four release downloads; leaving release as draft"
            exit 1
          fi
          for file in artifacts/*/*; do
            cmp "$file" "published/$(basename "$file")"
          done
          gh release edit "$RELEASE_TAG" --draft=false
